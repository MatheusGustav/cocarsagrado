<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documento — Cocar Sagrado</title>
  <meta name="description" content="Documento padrão do Cocar Sagrado." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/webp" href="/images/favicon.webp?v=3" />
  <meta name="theme-color" content="#142E20" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Figtree:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       DOCUMENTO PADRÃO · variante VERDE
       Modelo cru para qualquer finalidade, no estudo V4 "Raiz
       Viva" do site, no tom das seções escuras: verde profundo
       e dourado. Folhinhas pousadas pelas bordas e a pena dourada
       assina o centro como marca d'água. Estático — pronto pra PDF.
       ============================================================ */
    :root {
      --color-primary:          #142E20;
      --color-primary-deep:     #0E2117;
      --color-gold:             #A9873B;
      --color-gold-deep:        #8A6D2F;
      --color-gold-light:       #D2BA7C;
      --color-gold-mist:        #EAE0BE;
      --color-bg-page:          #F7F3E8;
      --color-text-on-dark:     #F2EEDD;
      --texto-corpo-escuro:     rgba(242, 238, 221, 0.82);
      --texto-suave-escuro:     rgba(242, 238, 221, 0.55);
      --linha-escura:           rgba(242, 238, 221, 0.16);
      --v4-salvia:        #93AC8F;
      --v4-salvia-forte:  #6E8F73;
      --v4-sussurro:      #DDE5CC;
      --v4-sombra-dura:   8px 8px 0 rgba(0, 0, 0, 0.28);
      --v4-radius-a:      26px 10px 26px 10px;
      --v4-radius-a-esp:  10px 26px 10px 26px;
      --fonte-titulo: 'Fraunces', Georgia, 'Times New Roman', serif;
      --fonte-corpo:  'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --curva-suave: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: var(--fonte-corpo);
      font-size: 16.5px;
      line-height: 1.65;
      background: var(--color-primary-deep);
      color: var(--texto-corpo-escuro);
      -webkit-font-smoothing: antialiased;
      padding: clamp(18px, 4vw, 56px) clamp(14px, 4vw, 40px);
    }
    ::selection { background: var(--color-gold-light); color: var(--color-primary-deep); }
    img { max-width: 100%; }

    /* === folhinhas estáticas pousadas pelas bordas === */
    .folha {
      position: absolute;
      z-index: 0;
      color: var(--v4-salvia);
      pointer-events: none;
    }
    .folha path {
      fill: rgba(242, 238, 221, 0.08);
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
    }
    .folha path:last-child { fill: none; }
    .folha--dourada { color: var(--color-gold-light); }
    .folha--dourada path { fill: rgba(210, 186, 124, 0.12); }
    .folha--1 { left: -7px;  top: 5%;  width: 26px; transform: rotate(-32deg); }
    .folha--2 { left: 16px;  top: 28%; width: 17px; transform: rotate(24deg); }
    .folha--3 { left: -5px;  top: 54%; width: 21px; transform: rotate(64deg); }
    .folha--4 { left: 14px;  top: 79%; width: 18px; transform: rotate(-12deg); }
    .folha--5 { right: -8px; top: 9%;  width: 28px; transform: rotate(28deg); }
    .folha--6 { right: 17px; top: 34%; width: 18px; transform: rotate(-42deg); }
    .folha--7 { right: -4px; top: 60%; width: 22px; transform: rotate(96deg); }
    .folha--8 { right: 15px; top: 84%; width: 24px; transform: rotate(-70deg); }

    /* === ramo que se desenha ao abrir o documento === */
    .ramo { display: block; width: min(300px, 72vw); margin: 26px auto 0; }
    .ramo-path {
      fill: none;
      stroke: var(--color-bg-page);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: ramo-desenha 1.5s ease 0.45s forwards;
    }
    .ramo-path--folha { animation-delay: 1.25s; animation-duration: 0.8s; }
    @keyframes ramo-desenha { to { stroke-dashoffset: 0; } }

    /* === blob que respira === */
    .jardim-blob {
      position: absolute;
      border-radius: 58% 42% 55% 45% / 45% 52% 48% 55%;
      animation: blob-respira 14s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes blob-respira {
      0%, 100% { border-radius: 58% 42% 55% 45% / 45% 52% 48% 55%; transform: rotate(0deg) scale(1); }
      33%      { border-radius: 45% 55% 48% 52% / 55% 45% 58% 42%; transform: rotate(2deg) scale(1.03); }
      66%      { border-radius: 52% 48% 42% 58% / 48% 58% 45% 52%; transform: rotate(-2deg) scale(0.985); }
    }

    /* === entrada suave === */
    .brota { opacity: 0; transform: translateY(14px); animation: brota 0.8s var(--curva-suave) forwards; }
    .brota--2 { animation-delay: 0.15s; }
    .brota--3 { animation-delay: 0.3s; }
    @keyframes brota { to { opacity: 1; transform: translateY(0); } }

    /* ============================================================
       A FOLHA DE PAPEL (verde)
       ============================================================ */
    .canteiro { position: relative; z-index: 1; max-width: 840px; margin: 0 auto; }

    .documento {
      position: relative;
      background: var(--color-primary);
      border: 1px solid rgba(210, 186, 124, 0.35);
      border-radius: var(--v4-radius-a);
      box-shadow: var(--v4-sombra-dura);
      padding: clamp(30px, 6vw, 64px) clamp(22px, 5.5vw, 60px);
      overflow: hidden;
    }
    /* moldura interna — toque de certificado */
    .documento::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(210, 186, 124, 0.22);
      border-radius: var(--v4-radius-a-esp);
      pointer-events: none;
    }
    /* pena dourada — marca d'água central */
    .pena {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(430px, 72%);
      transform: translate(-50%, -50%);
      opacity: 0.14;
      pointer-events: none;
      user-select: none;
    }
    .documento > *:not(.pena):not(.folha) { position: relative; }

    /* === cabeçalho === */
    .doc-header { text-align: center; }
    .jardim-mini {
      position: relative;
      width: 76px; height: 76px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
    }
    .jardim-mini .jardim-blob--salvia { inset: -8px; background: rgba(147, 172, 143, 0.2); }
    .jardim-mini .jardim-blob--ouro { inset: 6px -14px -6px 14px; background: rgba(210, 186, 124, 0.18); animation-delay: -7s; }
    .doc-logo { position: relative; width: 60px; height: 60px; border-radius: 50%; }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--color-gold-light);
      margin-bottom: 16px;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 34px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-gold-light));
    }
    .eyebrow::after { background: linear-gradient(90deg, var(--color-gold-light), transparent); }

    .doc-title {
      font-family: var(--fonte-titulo);
      font-optical-sizing: auto;
      font-weight: 560;
      font-size: clamp(2rem, 5.2vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--color-text-on-dark);
      text-wrap: balance;
    }
    .grifo { font-style: italic; font-weight: 460; color: var(--color-gold-light); }
    .doc-sub { margin-top: 12px; color: var(--texto-suave-escuro); font-size: 15px; }

    /* === meta: até 3 pares rótulo/valor === */
    .doc-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px 40px;
      margin-top: 30px;
      padding: 16px 10px;
      border-top: 1px solid var(--linha-escura);
      border-bottom: 1px solid var(--linha-escura);
    }
    .doc-meta div { text-align: center; }
    .doc-meta dt {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--texto-suave-escuro);
    }
    .doc-meta dd { font-weight: 600; color: var(--color-text-on-dark); font-size: 15.5px; }

    /* ============================================================
       CORPO LIVRE — utilitários
       h2 = rótulo de seção · p/ul = texto · .plaqueta = destaque
       central · .destaque = citação/observação com aspas
       ============================================================ */
    .doc-corpo { margin-top: 34px; }
    .doc-corpo h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-gold-light);
      margin: 26px 0 8px;
    }
    .doc-corpo h2::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--color-gold-light);
      flex: none;
    }
    .doc-corpo p { color: var(--color-text-on-dark); font-size: 15.5px; }
    .doc-corpo p + p { margin-top: 10px; }
    .doc-corpo .obs { color: var(--texto-suave-escuro); font-size: 13.5px; }
    .doc-corpo ul { list-style: none; margin: 8px 0; }
    .doc-corpo li {
      position: relative;
      padding-left: 22px;
      color: var(--color-text-on-dark);
      font-size: 15.5px;
      margin-top: 6px;
    }
    /* folhinha de marcador, desenhada em CSS */
    .doc-corpo li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 0.52em;
      width: 9px;
      height: 9px;
      background: var(--v4-salvia);
      border-radius: 0 70% 0 70%;
      transform: rotate(45deg);
    }

    .plaqueta {
      margin: 30px auto;
      max-width: 560px;
      text-align: center;
      background: var(--color-primary-deep);
      border: 1px solid rgba(210, 186, 124, 0.35);
      border-radius: var(--v4-radius-a-esp);
      padding: 24px 26px 28px;
    }
    .plaqueta-rotulo {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-gold-light);
    }
    .plaqueta-titulo {
      font-family: var(--fonte-titulo);
      font-weight: 560;
      font-size: clamp(1.6rem, 4.4vw, 2.4rem);
      line-height: 1.1;
      color: var(--color-text-on-dark);
      margin-top: 8px;
    }
    .plaqueta-sub { margin-top: 6px; color: var(--texto-corpo-escuro); font-size: 15.5px; }
    .plaqueta-sub strong { color: var(--color-gold-light); font-weight: 600; }

    .destaque {
      position: relative;
      margin: 30px 0;
      background: var(--color-primary-deep);
      border-radius: var(--v4-radius-a);
      padding: 26px clamp(22px, 4.5vw, 44px) 26px clamp(30px, 6vw, 56px);
      overflow: hidden;
    }
    .destaque::before {
      content: "“";
      position: absolute;
      top: 2px;
      left: 14px;
      font-family: var(--fonte-titulo);
      font-size: 74px;
      line-height: 1;
      color: rgba(210, 186, 124, 0.4);
    }
    .destaque h2 { margin-top: 0 !important; }
    .destaque p {
      font-family: var(--fonte-titulo);
      font-weight: 400;
      font-size: 17.5px;
      line-height: 1.7;
      color: var(--color-text-on-dark);
    }

    /* === rodapé === */
    .doc-footer {
      margin-top: 38px;
      padding-top: 22px;
      border-top: 1px solid var(--linha-escura);
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .assinatura strong { display: block; color: var(--color-text-on-dark); font-size: 15.5px; }
    .assinatura span { color: var(--texto-suave-escuro); font-size: 13.5px; }
    .axe {
      font-family: var(--fonte-titulo);
      font-style: italic;
      font-size: 21px;
      color: var(--color-gold-light);
    }
    .doc-nota {
      position: relative;
      z-index: 1;
      margin: 16px auto 0;
      max-width: 840px;
      text-align: center;
      color: rgba(242, 238, 221, 0.4);
      font-size: 12.5px;
    }

    @media (max-width: 620px) {
      .doc-meta { gap: 12px 26px; }
    }

    @media print {
      body { padding: 0; background: var(--color-primary); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .canteiro { max-width: none; }
      .documento { box-shadow: none; border-radius: 0; }
      .brota, .ramo-path { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
      .plaqueta, .destaque { break-inside: avoid; }
      .pena { opacity: 0.14; }
      .doc-nota { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .jardim-blob { animation: none; }
      .brota { animation-duration: 0.01s; }
      .ramo-path { animation-duration: 0.01s; animation-delay: 0s; }
    }
  </style>
</head>
<body>

  <div class="canteiro">
    <main class="documento">

      <!-- pena dourada — marca d'água central -->
      <img class="pena" src="images/pena-dourada.webp" alt="" aria-hidden="true" width="664" height="900" />

      <!-- folhinhas pousadas pelas bordas -->
      <svg class="folha folha--1" viewBox="0 0 40 64" aria-hidden="true"><path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" /><path d="M20 12 L 20 52" /></svg>
      <svg class="folha folha--2 folha--dourada" viewBox="0 0 40 64" aria-hidden="true"><path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" /><path d="M20 12 L 20 52" /></svg>
      <svg class="folha folha--3" viewBox="0 0 40 64" aria-hidden="true"><path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" /><path d="M20 12 L 20 52" /></svg>
      <svg class="folha folha--4 folha--dourada" viewBox="0 0 40 64" aria-hidden="true"><path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" /><path d="M20 12 L 20 52" /></svg>
      <svg class="folha folha--5" viewBox="0 0 40 64" aria-hidden="true"><path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" /><path d="M20 12 L 20 52" /></svg>
      <svg class="folha folha--6 folha--dourada" viewBox="0 0 40 64" aria-hidden="true"><path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" /><path d="M20 12 L 20 52" /></svg>
      <svg class="folha folha--7" viewBox="0 0 40 64" aria-hidden="true"><path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" /><path d="M20 12 L 20 52" /></svg>
      <svg class="folha folha--8" viewBox="0 0 40 64" aria-hidden="true"><path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" /><path d="M20 12 L 20 52" /></svg>

      <header class="doc-header brota">
        <div class="jardim-mini" aria-hidden="true">
          <span class="jardim-blob jardim-blob--salvia"></span>
          <span class="jardim-blob jardim-blob--ouro"></span>
          <img src="images/logo-icone.webp" alt="Cocar Sagrado" class="doc-logo" width="60" height="60" />
        </div>
        <p class="eyebrow">Cocar Sagrado</p>
        <h1 class="doc-title">[Título do documento]</h1>
        <p class="doc-sub">[Subtítulo ou descrição breve]</p>

        <dl class="doc-meta">
          <div>
            <dt>[Rótulo]</dt>
            <dd>[Valor]</dd>
          </div>
          <div>
            <dt>[Rótulo]</dt>
            <dd>[Valor]</dd>
          </div>
          <div>
            <dt>[Rótulo]</dt>
            <dd>[Valor]</dd>
          </div>
        </dl>

        <svg class="ramo" viewBox="0 0 320 44" aria-hidden="true">
          <path class="ramo-path" pathLength="1" d="M6 26 C 60 12, 120 36, 160 24 C 210 10, 260 32, 314 18" />
          <path class="ramo-path ramo-path--folha" pathLength="1" d="M72 22 q 8 -16 22 -13 q -5 16 -22 13 Z" />
          <path class="ramo-path ramo-path--folha" pathLength="1" d="M182 24 q 10 13 25 9 q -6 -16 -25 -9 Z" />
          <path class="ramo-path ramo-path--folha" pathLength="1" d="M260 24 q 8 -16 22 -13 q -5 16 -22 13 Z" />
        </svg>
      </header>

      <!-- Corpo livre: use h2 (rótulo de seção), p, ul,
           .plaqueta (destaque central) e .destaque (citação). -->
      <section class="doc-corpo brota brota--2">
        <h2>[Seção]</h2>
        <p>[Conteúdo do documento.]</p>
      </section>

      <footer class="doc-footer brota brota--3">
        <div class="assinatura">
          <strong>[Emitido por]</strong>
          <span>Cocar Sagrado · cocarsagrado.com.br · @cocarsagrado</span>
        </div>
        <p class="axe">Muito axé.</p>
      </footer>

    </main>
  </div>

  <p class="doc-nota">Documento emitido pelo Cocar Sagrado.</p>

</body>
</html>
