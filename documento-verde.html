<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documento — Cocar Sagrado</title>
  <meta name="description" content="Documento padrão do Cocar Sagrado." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/webp" href="/images/favicon.webp?v=3" />
  <meta name="theme-color" content="#142E20" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Figtree:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       DOCUMENTO PADRÃO · variante VERDE
       Modelo cru para qualquer finalidade, no estudo V4 "Raiz
       Viva" do site, no tom das seções escuras: verde profundo
       e dourado. Folhagem transborda pelos cantos e a pena dourada
       assina o centro como marca d'água. Estático — pronto pra PDF.
       ============================================================ */
    :root {
      --color-primary:          #142E20;
      --color-primary-deep:     #0E2117;
      --color-gold:             #A9873B;
      --color-gold-deep:        #8A6D2F;
      --color-gold-light:       #D2BA7C;
      --color-gold-mist:        #EAE0BE;
      --color-bg-page:          #F7F3E8;
      --color-text-on-dark:     #F2EEDD;
      --texto-corpo-escuro:     rgba(242, 238, 221, 0.82);
      --texto-suave-escuro:     rgba(242, 238, 221, 0.55);
      --linha-escura:           rgba(242, 238, 221, 0.16);
      --v4-salvia:        #93AC8F;
      --v4-salvia-forte:  #6E8F73;
      --v4-sussurro:      #DDE5CC;
      --v4-sombra-dura:   8px 8px 0 rgba(0, 0, 0, 0.28);
      --v4-radius-a:      26px 10px 26px 10px;
      --v4-radius-a-esp:  10px 26px 10px 26px;
      --fonte-titulo: 'Fraunces', Georgia, 'Times New Roman', serif;
      --fonte-corpo:  'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --curva-suave: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: var(--fonte-corpo);
      font-size: 16.5px;
      line-height: 1.65;
      background: var(--color-primary-deep);
      color: var(--texto-corpo-escuro);
      -webkit-font-smoothing: antialiased;
      padding: clamp(18px, 4vw, 56px) clamp(14px, 4vw, 40px);
    }
    ::selection { background: var(--color-gold-light); color: var(--color-primary-deep); }
    img { max-width: 100%; }

    /* === folhagem transbordando pelos cantos ===
       Folhas grandes cortadas pela borda do papel, como se o mato
       crescesse por trás do documento. Dois cantos opostos.
       Ajuste fino: opacity abaixo é o botão de discrição. */
    .canto {
      position: absolute;
      z-index: 0;
      width: 240px;
      overflow: visible;
      opacity: 0.7;
      pointer-events: none;
    }
    .canto--tl { top: -30px; left: -30px; }
    .canto--br { bottom: -30px; right: -30px; transform: rotate(180deg); }

    /* === ramo que se desenha ao abrir o documento === */
    .ramo { display: block; width: min(300px, 72vw); margin: 26px auto 0; }
    .ramo-path {
      fill: none;
      stroke: var(--color-bg-page);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: ramo-desenha 1.5s ease 0.45s forwards;
    }
    .ramo-path--folha { animation-delay: 1.25s; animation-duration: 0.8s; }
    @keyframes ramo-desenha { to { stroke-dashoffset: 0; } }

    /* === blob que respira === */
    .jardim-blob {
      position: absolute;
      border-radius: 58% 42% 55% 45% / 45% 52% 48% 55%;
      animation: blob-respira 14s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes blob-respira {
      0%, 100% { border-radius: 58% 42% 55% 45% / 45% 52% 48% 55%; transform: rotate(0deg) scale(1); }
      33%      { border-radius: 45% 55% 48% 52% / 55% 45% 58% 42%; transform: rotate(2deg) scale(1.03); }
      66%      { border-radius: 52% 48% 42% 58% / 48% 58% 45% 52%; transform: rotate(-2deg) scale(0.985); }
    }

    /* === entrada suave === */
    .brota { opacity: 0; transform: translateY(14px); animation: brota 0.8s var(--curva-suave) forwards; }
    .brota--2 { animation-delay: 0.15s; }
    .brota--3 { animation-delay: 0.3s; }
    @keyframes brota { to { opacity: 1; transform: translateY(0); } }

    /* === edição direta no navegador ===
       Os campos são contenteditable: clica e digita. O que foi
       digitado vira rascunho no localStorage (por agendamento);
       "Recomeçar" apaga. O halo dourado some no PDF. */
    [contenteditable] { border-radius: 6px; }
    [contenteditable]:hover { box-shadow: 0 0 0 1px rgba(210, 186, 124, 0.35); cursor: text; }
    [contenteditable]:focus {
      outline: none;
      box-shadow: 0 0 0 1px rgba(210, 186, 124, 0.6);
      background: rgba(210, 186, 124, 0.06);
    }
    /* Ações no fim da página, alinhadas à direita — rolam junto
       com o documento (nada de botão flutuante grudado na tela). */
    .doc-acoes {
      position: relative;
      z-index: 1;
      max-width: 840px;
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn-pdf {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--fonte-corpo);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--color-primary-deep);
      background: var(--color-gold-light);
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      cursor: pointer;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.28);
      transition: transform 0.2s var(--curva-suave), box-shadow 0.2s var(--curva-suave);
    }
    .btn-pdf:hover { transform: translateY(-2px); box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.28); }
    .btn-limpar {
      font-family: var(--fonte-corpo);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-gold-light);
      background: rgba(14, 33, 23, 0.85);
      border: 1px solid rgba(210, 186, 124, 0.5);
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
    }
    .btn-limpar:hover { background: rgba(210, 186, 124, 0.12); }

    /* embutido no modal do painel: papel encosta mais nas bordas */
    html.embutido body { padding: 20px 12px; }

    /* ============================================================
       A FOLHA DE PAPEL (verde)
       ============================================================ */
    .canteiro { position: relative; z-index: 1; max-width: 840px; margin: 0 auto; }

    .documento {
      position: relative;
      background: var(--color-primary);
      border: 1px solid rgba(210, 186, 124, 0.35);
      border-radius: var(--v4-radius-a);
      box-shadow: var(--v4-sombra-dura);
      padding: clamp(30px, 6vw, 64px) clamp(22px, 5.5vw, 60px);
      overflow: hidden;
    }
    /* moldura interna — toque de certificado */
    .documento::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(210, 186, 124, 0.22);
      border-radius: var(--v4-radius-a-esp);
      pointer-events: none;
    }
    /* pena dourada — marca d'água central */
    .pena {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(430px, 72%);
      /* trava a proporção do arquivo (664×900) — nenhum contexto
         (celular, iframe do painel, print) pode achatar a pena. */
      height: auto;
      aspect-ratio: 664 / 900;
      object-fit: contain;
      transform: translate(-50%, -50%);
      opacity: 0.14;
      pointer-events: none;
      user-select: none;
    }
    .documento > *:not(.pena):not(.canto) { position: relative; }

    /* === cabeçalho === */
    .doc-header { text-align: center; }
    .jardim-mini {
      position: relative;
      width: 76px; height: 76px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
    }
    .jardim-mini .jardim-blob--salvia { inset: -8px; background: rgba(147, 172, 143, 0.2); }
    .jardim-mini .jardim-blob--ouro { inset: 6px -14px -6px 14px; background: rgba(210, 186, 124, 0.18); animation-delay: -7s; }
    .doc-logo { position: relative; width: 60px; height: 60px; border-radius: 50%; }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--color-gold-light);
      margin-bottom: 16px;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 34px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-gold-light));
    }
    .eyebrow::after { background: linear-gradient(90deg, var(--color-gold-light), transparent); }

    .doc-title {
      font-family: var(--fonte-titulo);
      font-optical-sizing: auto;
      font-weight: 560;
      font-size: clamp(2rem, 5.2vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--color-text-on-dark);
      text-wrap: balance;
    }
    .grifo { font-style: italic; font-weight: 460; color: var(--color-gold-light); }
    .doc-sub { margin-top: 12px; color: var(--texto-suave-escuro); font-size: 15px; }

    /* === meta: até 3 pares rótulo/valor === */
    .doc-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px 40px;
      margin-top: 30px;
      padding: 16px 10px;
      border-top: 1px solid var(--linha-escura);
      border-bottom: 1px solid var(--linha-escura);
    }
    .doc-meta div { text-align: center; }
    .doc-meta dt {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--texto-suave-escuro);
    }
    .doc-meta dd { font-weight: 600; color: var(--color-text-on-dark); font-size: 15.5px; }

    /* ============================================================
       CORPO LIVRE — utilitários
       h2 = rótulo de seção · p/ul = texto · .plaqueta = destaque
       central · .destaque = citação/observação com aspas
       ============================================================ */
    .doc-corpo { margin-top: 34px; }
    /* cada seção é um bloco: dá pra somar quantos quiser ("+ Seção")
       e remover um a um. Os controles só existem na tela. */
    .bloco { position: relative; }
    .bloco + .bloco { margin-top: 4px; }
    .btn-remover {
      position: absolute;
      top: 24px;
      right: -6px;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      font-family: var(--fonte-corpo);
      font-size: 16px;
      line-height: 1;
      color: var(--texto-suave-escuro);
      background: transparent;
      border: 1px solid var(--linha-escura);
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .bloco:hover .btn-remover, .btn-remover:focus-visible { opacity: 1; }
    .btn-remover:hover { color: var(--color-gold-light); border-color: var(--color-gold-light); }
    .doc-corpo .bloco:only-child .btn-remover { display: none; }
    .btn-secao {
      display: block;
      width: 100%;
      margin-top: 18px;
      font-family: var(--fonte-corpo);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--texto-suave-escuro);
      background: transparent;
      border: 1px dashed var(--linha-escura);
      border-radius: var(--v4-radius-a-esp);
      padding: 12px;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .btn-secao:hover { color: var(--color-gold-light); border-color: rgba(210, 186, 124, 0.5); }
    .doc-corpo h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-gold-light);
      margin: 26px 0 8px;
    }
    .doc-corpo h2::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--color-gold-light);
      flex: none;
    }
    .doc-corpo p { color: var(--color-text-on-dark); font-size: 15.5px; }
    .doc-corpo p + p { margin-top: 10px; }
    .doc-corpo .obs { color: var(--texto-suave-escuro); font-size: 13.5px; }
    .doc-corpo ul { list-style: none; margin: 8px 0; }
    .doc-corpo li {
      position: relative;
      padding-left: 22px;
      color: var(--color-text-on-dark);
      font-size: 15.5px;
      margin-top: 6px;
    }
    /* folhinha de marcador, desenhada em CSS */
    .doc-corpo li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 0.52em;
      width: 9px;
      height: 9px;
      background: var(--v4-salvia);
      border-radius: 0 70% 0 70%;
      transform: rotate(45deg);
    }

    .plaqueta {
      margin: 30px auto;
      max-width: 560px;
      text-align: center;
      background: var(--color-primary-deep);
      border: 1px solid rgba(210, 186, 124, 0.35);
      border-radius: var(--v4-radius-a-esp);
      padding: 24px 26px 28px;
    }
    .plaqueta-rotulo {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-gold-light);
    }
    .plaqueta-titulo {
      font-family: var(--fonte-titulo);
      font-weight: 560;
      font-size: clamp(1.6rem, 4.4vw, 2.4rem);
      line-height: 1.1;
      color: var(--color-text-on-dark);
      margin-top: 8px;
    }
    .plaqueta-sub { margin-top: 6px; color: var(--texto-corpo-escuro); font-size: 15.5px; }
    .plaqueta-sub strong { color: var(--color-gold-light); font-weight: 600; }

    .destaque {
      position: relative;
      margin: 30px 0;
      background: var(--color-primary-deep);
      border-radius: var(--v4-radius-a);
      padding: 26px clamp(22px, 4.5vw, 44px) 26px clamp(30px, 6vw, 56px);
      overflow: hidden;
    }
    .destaque::before {
      content: "“";
      position: absolute;
      top: 2px;
      left: 14px;
      font-family: var(--fonte-titulo);
      font-size: 74px;
      line-height: 1;
      color: rgba(210, 186, 124, 0.4);
    }
    .destaque h2 { margin-top: 0 !important; }
    .destaque p {
      font-family: var(--fonte-titulo);
      font-weight: 400;
      font-size: 17.5px;
      line-height: 1.7;
      color: var(--color-text-on-dark);
    }

    /* === rodapé === */
    .doc-footer {
      margin-top: 38px;
      padding-top: 22px;
      border-top: 1px solid var(--linha-escura);
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .assinatura strong { display: block; color: var(--color-text-on-dark); font-size: 15.5px; }
    .assinatura span { color: var(--texto-suave-escuro); font-size: 13.5px; }
    .axe {
      font-family: var(--fonte-titulo);
      font-style: italic;
      font-size: 21px;
      color: var(--color-gold-light);
    }
    @media (max-width: 620px) {
      .doc-meta { gap: 12px 26px; }
    }

    @media print {
      body { padding: 0; background: var(--color-primary); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .canteiro { max-width: none; }
      .documento { box-shadow: none; border-radius: 0; }
      .brota, .ramo-path { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
      .plaqueta, .destaque { break-inside: avoid; }
      /* no PDF a largura é a da folha, não a da tela — e a proporção
         fica travada de novo aqui pra não depender da tela de origem. */
      .pena { opacity: 0.14; width: 430px; height: auto; aspect-ratio: 664 / 900; }
      .doc-acoes, .btn-secao, .btn-remover { display: none; }
      .bloco { break-inside: avoid; }
      [contenteditable]:hover, [contenteditable]:focus { box-shadow: none; background: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .jardim-blob { animation: none; }
      .brota { animation-duration: 0.01s; }
      .ramo-path { animation-duration: 0.01s; animation-delay: 0s; }
    }
  </style>
</head>
<body>

  <div class="canteiro">
    <main class="documento">

      <!-- pena dourada — marca d'água central -->
      <img class="pena" src="images/pena-dourada.webp" alt="" aria-hidden="true" width="664" height="900" />

      <!-- folhagem transbordando pelos cantos -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <g id="folha-canto">
            <path d="M20 3 C 33 18, 35 38, 20 61 C 5 38, 7 18, 20 3 Z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            <path d="M20 12 L 20 52" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </g>
        </defs>
      </svg>
      <svg class="canto canto--tl" viewBox="0 0 250 250" aria-hidden="true">
        <use href="#folha-canto" style="color: var(--v4-salvia-forte)" transform="translate(48 70) rotate(135) scale(2.3) translate(-20 -32)" />
        <use href="#folha-canto" style="color: var(--color-gold-light)" transform="translate(96 42) rotate(105) scale(1.7) translate(-20 -32)" />
        <use href="#folha-canto" style="color: var(--v4-salvia)" transform="translate(26 120) rotate(162) scale(1.6) translate(-20 -32)" />
        <use href="#folha-canto" style="color: var(--color-gold-light)" transform="translate(120 18) rotate(85) scale(1) translate(-20 -32)" />
      </svg>
      <svg class="canto canto--br" viewBox="0 0 250 250" aria-hidden="true">
        <use href="#folha-canto" style="color: var(--v4-salvia-forte)" transform="translate(48 70) rotate(135) scale(2.3) translate(-20 -32)" />
        <use href="#folha-canto" style="color: var(--color-gold-light)" transform="translate(96 42) rotate(105) scale(1.7) translate(-20 -32)" />
        <use href="#folha-canto" style="color: var(--v4-salvia)" transform="translate(26 120) rotate(162) scale(1.6) translate(-20 -32)" />
        <use href="#folha-canto" style="color: var(--color-gold-light)" transform="translate(120 18) rotate(85) scale(1) translate(-20 -32)" />
      </svg>

      <header class="doc-header brota">
        <div class="jardim-mini" aria-hidden="true">
          <span class="jardim-blob jardim-blob--salvia"></span>
          <span class="jardim-blob jardim-blob--ouro"></span>
          <img src="images/logo-icone.webp" alt="Cocar Sagrado" class="doc-logo" width="60" height="60" />
        </div>
        <p class="eyebrow">Cocar Sagrado</p>
        <h1 class="doc-title" contenteditable="true" data-campo="titulo">[Título do documento]</h1>
        <p class="doc-sub" contenteditable="true" data-campo="sub">[Subtítulo ou descrição breve]</p>

        <dl class="doc-meta">
          <div>
            <dt contenteditable="true" data-campo="m1r" id="meta-rotulo-1">[Rótulo]</dt>
            <dd contenteditable="true" data-campo="m1v" id="meta-valor-1">[Valor]</dd>
          </div>
          <div>
            <dt contenteditable="true" data-campo="m2r" id="meta-rotulo-2">[Rótulo]</dt>
            <dd contenteditable="true" data-campo="m2v" id="meta-valor-2">[Valor]</dd>
          </div>
          <div>
            <dt contenteditable="true" data-campo="m3r" id="meta-rotulo-3">[Rótulo]</dt>
            <dd contenteditable="true" data-campo="m3v" id="meta-valor-3">[Valor]</dd>
          </div>
        </dl>

        <svg class="ramo" viewBox="0 0 320 44" aria-hidden="true">
          <path class="ramo-path" pathLength="1" d="M6 26 C 60 12, 120 36, 160 24 C 210 10, 260 32, 314 18" />
          <path class="ramo-path ramo-path--folha" pathLength="1" d="M72 22 q 8 -16 22 -13 q -5 16 -22 13 Z" />
          <path class="ramo-path ramo-path--folha" pathLength="1" d="M182 24 q 10 13 25 9 q -6 -16 -25 -9 Z" />
          <path class="ramo-path ramo-path--folha" pathLength="1" d="M260 24 q 8 -16 22 -13 q -5 16 -22 13 Z" />
        </svg>
      </header>

      <!-- Corpo livre: cada .bloco é uma seção (rótulo + texto).
           O botão "+ Seção" clona este molde quantas vezes precisar. -->
      <section class="doc-corpo brota brota--2" id="doc-corpo">
        <div class="bloco">
          <button class="btn-remover" type="button" title="Remover esta seção" aria-label="Remover esta seção">×</button>
          <h2 contenteditable="true">[Seção]</h2>
          <p contenteditable="true">[Conteúdo do documento.]</p>
        </div>
      </section>
      <button class="btn-secao" type="button" id="btn-secao">+ Seção</button>

      <footer class="doc-footer brota brota--3">
        <div class="assinatura">
          <strong contenteditable="true" data-campo="emitente" id="doc-emitente">[Emitido por]</strong>
          <span>Cocar Sagrado · cocarsagrado.com.br · @cocarsagrado</span>
        </div>
        <p class="axe">Axé.</p>
      </footer>

    </main>
  </div>

  <div class="doc-acoes">
    <button class="btn-limpar" type="button" id="btn-limpar" title="Apaga o rascunho e volta ao modelo limpo">Recomeçar</button>
    <button class="btn-pdf" type="button" id="btn-pdf" title="Imprimir ou salvar como PDF">Gerar PDF</button>
  </div>

  <script>
    (function () {
      // Vindo do painel admin: ?ag=<id>&embutido=1&nome=&leitura=&data=&terapeuta=
      const q = new URLSearchParams(location.search);
      // Campos fixos (cabeçalho/rodapé) x corpo, que cresce em seções.
      const campos = document.querySelectorAll('[data-campo]');
      const corpo  = document.getElementById('doc-corpo');
      const chaveRascunho = `doc-rascunho-${q.get('ag') || 'avulso'}`;
      const MOLDE_BLOCO = corpo.innerHTML;

      if (q.get('embutido')) document.documentElement.classList.add('embutido');

      // 1) Pré-preenchimento com os dados do agendamento.
      const poe = (id, texto) => {
        const el = document.getElementById(id);
        if (el && texto) el.textContent = texto;
      };
      if (q.get('nome')) {
        poe('meta-rotulo-1', 'Cliente');
        poe('meta-valor-1', q.get('nome'));
        document.title = `Documento — ${q.get('nome')} — Cocar Sagrado`;
      }
      if (q.get('leitura')) { poe('meta-rotulo-2', 'Leitura'); poe('meta-valor-2', q.get('leitura')); }
      if (q.get('data'))    { poe('meta-rotulo-3', 'Data');    poe('meta-valor-3', q.get('data')); }
      poe('doc-emitente', q.get('terapeuta'));

      // 2) Rascunho automático por agendamento, neste navegador.
      //    Restaura por cima do pré-preenchimento: o que foi digitado vence.
      //    O corpo vai inteiro (guarda também as seções somadas).
      try {
        const dados = JSON.parse(localStorage.getItem(chaveRascunho));
        if (dados) {
          campos.forEach(el => {
            const v = dados[el.dataset.campo];
            if (v != null) el.innerHTML = v;
          });
          if (dados._corpo) corpo.innerHTML = dados._corpo;
        }
      } catch (e) { /* rascunho corrompido: segue com o modelo limpo */ }

      let tRascunho;
      const salvarRascunho = () => {
        const dados = { _corpo: corpo.innerHTML };
        campos.forEach(el => { dados[el.dataset.campo] = el.innerHTML; });
        try { localStorage.setItem(chaveRascunho, JSON.stringify(dados)); } catch (e) {}
      };
      const agendarRascunho = () => {
        clearTimeout(tRascunho);
        tRascunho = setTimeout(salvarRascunho, 350);
      };

      // Delegação no documento inteiro: pega também as seções criadas depois.
      document.addEventListener('input', (e) => {
        if (e.target.isContentEditable) agendarRascunho();
      });
      // Campo ainda com [placeholder] seleciona tudo ao focar: digitar já substitui.
      document.addEventListener('focusin', (e) => {
        const el = e.target;
        if (!el.isContentEditable) return;
        const t = el.textContent.trim();
        if (t.startsWith('[') && t.endsWith(']')) {
          const sel = getSelection();
          sel.removeAllRanges();
          const r = document.createRange();
          r.selectNodeContents(el);
          sel.addRange(r);
        }
      });
      // Colar sempre como texto puro — não traz fonte/cor de fora.
      document.addEventListener('paste', (e) => {
        if (!e.target.isContentEditable) return;
        e.preventDefault();
        const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, txt);
      });

      // 2b) Seções: somar e remover.
      document.getElementById('btn-secao').addEventListener('click', () => {
        const molde = document.createElement('div');
        molde.innerHTML = MOLDE_BLOCO;
        const bloco = molde.querySelector('.bloco');
        corpo.appendChild(bloco);
        bloco.querySelector('h2').focus();
        salvarRascunho();
      });
      corpo.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-remover');
        if (!btn) return;
        btn.closest('.bloco').remove();
        salvarRascunho();
      });

      document.getElementById('btn-limpar').addEventListener('click', () => {
        if (!confirm('Apagar o rascunho deste documento e recomeçar do modelo limpo?')) return;
        localStorage.removeItem(chaveRascunho);
        location.reload();
      });

      // 3) Gerar PDF: avisa o painel (selinho "doc emitido") e imprime.
      document.getElementById('btn-pdf').addEventListener('click', () => {
        const painel = window.parent !== window ? window.parent : window.opener;
        if (q.get('ag') && painel) {
          painel.postMessage({ tipo: 'documento-pdf-gerado', ag: q.get('ag') }, location.origin);
        }
        window.print();
      });
    })();
  </script>

</body>
</html>
